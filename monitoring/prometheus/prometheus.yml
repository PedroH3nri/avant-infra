# Coleta das métricas do Avant. Roda na VM menor, junto com Grafana e Loki.
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: avant-api
    metrics_path: /api/v1/metrics
    static_configs:
      # Endereços internos das instâncias da API (blue e green).
      - targets: ["api-blue:8000", "api-green:8000"]

  - job_name: avant-worker
    static_configs:
      - targets: ["worker:9808"]
