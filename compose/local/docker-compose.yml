# Ambiente local do Avant.
# Os serviços de aplicação usam os repositórios irmãos (../avant-api etc.),
# clonados na mesma pasta que este repositório.
#
#   cp .env.example .env
#   docker compose -f compose/local/docker-compose.yml --env-file .env up -d
#
# HTTPS local (opcional, para o Safari ou para reproduzir a VM):
#   mkcert -cert-file .certs/avant.localhost.pem -key-file .certs/avant.localhost-key.pem avant.localhost
#   docker compose -f compose/local/docker-compose.yml --env-file .env --profile https up -d nginx

name: avant

# A api, o worker e o scheduler não sobem sem REDIS_URL, CELERY_BROKER_URL e o transporte de
# e-mail (MAIL_TRANSPORT e a configuração dele). As URLs dos containers são montadas aqui; o
# MAIL_TRANSPORT (smtp no local, para o Mailpit) vem do .env.
x-app-env: &app-env
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-avant}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
  REDIS_URL: redis://redis:6379/0
  SMTP_URL: smtp://mailpit:1025

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avant}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../postgres/init:/docker-entrypoint-initdb.d:ro
    # Senhas como secrets (compose 2.23 ou mais novo): não ficam no ambiente do contêiner.
    secrets: [postgres-password, avant-owner-password, avant-app-password]
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-avant}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina no .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Caixa de e-mail local: a api e o worker enviam por SMTP (MAIL_TRANSPORT=smtp) e os e-mails
  # (convite, nova senha, avisos) aparecem em http://localhost:8025. Nada sai para a internet.
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      retries: 10

  # Os serviços abaixo sobem quando os repositórios existirem localmente.
  # Ative com: docker compose --profile app up -d
  api:
    profiles: ["app"]
    build:
      context: ../../../avant-api
      secrets: [github_token]
    env_file: ../../.env
    environment:
      <<: *app-env
      # Só o nginx do compose pode mandar X-Forwarded-For (a api recusa "*").
      FORWARDED_ALLOW_IPS: ${AVANT_LOCAL_NGINX_IP:-10.250.0.10}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    profiles: ["app"]
    build:
      context: ../../../avant-worker
      secrets: [github_token]
    command: ["celery", "-A", "avant_worker.app", "worker", "-Q", "default,mail,gam", "-l", "info"]
    env_file: ../../.env
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    profiles: ["app"]
    build:
      context: ../../../avant-worker
      secrets: [github_token]
    command: ["celery", "-A", "avant_worker.app", "beat", "-l", "info"]
    env_file: ../../.env
    environment: *app-env
    depends_on:
      rabbitmq: { condition: service_healthy }

  web:
    profiles: ["app"]
    build: ../../../avant-web
    depends_on: [api]

  # HTTPS local opcional (perfil https, desligado por padrão) em https://avant.localhost, com o
  # certificado do mkcert (docs/desenvolvimento.md, "HTTPS local (opcional)"). Sem o certificado
  # em .certs/, o nginx não sobe. Por padrão manda para o uvicorn e o Vite rodando na máquina; no
  # perfil app, AVANT_API_UPSTREAM=api:8000 e AVANT_WEB_UPSTREAM=web:8080.
  nginx:
    profiles: ["https"]
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    environment:
      AVANT_API_UPSTREAM: ${AVANT_API_UPSTREAM:-host.docker.internal:8000}
      AVANT_WEB_UPSTREAM: ${AVANT_WEB_UPSTREAM:-host.docker.internal:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # IP fixo: é o único endereço de quem a api aceita X-Forwarded-For (FORWARDED_ALLOW_IPS).
    networks:
      default:
        ipv4_address: ${AVANT_LOCAL_NGINX_IP:-10.250.0.10}
    volumes:
      - ../../nginx/avant.conf:/etc/nginx/templates/default.conf.template:ro
      - ${AVANT_LOCAL_CERTS_DIR:-../../.certs}:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"

# Subnet fixa para o nginx ter IP fixo. Se ela conflitar com uma rede da sua máquina (VPN, por
# exemplo), troque AVANT_LOCAL_SUBNET, AVANT_LOCAL_DYNAMIC_IP_RANGE e AVANT_LOCAL_NGINX_IP no .env.
networks:
  default:
    ipam:
      config:
        - subnet: ${AVANT_LOCAL_SUBNET:-10.250.0.0/24}
          # Os outros containers pegam IP só daqui: o do nginx nunca fica ocupado.
          ip_range: ${AVANT_LOCAL_DYNAMIC_IP_RANGE:-10.250.0.128/25}

secrets:
  # Token só de leitura do GitHub para o build da api e do worker (o avant-core é privado):
  # GITHUB_TOKEN="$(gh auth token)" docker compose ... --profile app build
  github_token:
    environment: GITHUB_TOKEN
  postgres-password:
    environment: POSTGRES_SUPERUSER_PASSWORD
  avant-owner-password:
    environment: AVANT_OWNER_PASSWORD
  avant-app-password:
    environment: AVANT_APP_PASSWORD

volumes:
  postgres-data:
