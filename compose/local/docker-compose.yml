# Ambiente local do Avant.
# Os serviços de aplicação usam os repositórios irmãos (../avant-api etc.),
# clonados na mesma pasta que este repositório.
#
#   cp .env.example .env
#   docker compose -f compose/local/docker-compose.yml --env-file .env up -d

name: avant

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avant}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina no .env}
      AVANT_OWNER_PASSWORD: ${AVANT_OWNER_PASSWORD:?defina no .env}
      AVANT_APP_PASSWORD: ${AVANT_APP_PASSWORD:?defina no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-avant}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina no .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Os serviços abaixo sobem quando os repositórios existirem localmente.
  # Ative com: docker compose --profile app up -d
  api:
    profiles: ["app"]
    build: ../../../avant-api
    env_file: ../../.env
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8000:8000"

  worker:
    profiles: ["app"]
    build: ../../../avant-worker
    command: ["celery", "-A", "avant_worker.app", "worker", "-Q", "default,mail,gam", "-l", "info"]
    env_file: ../../.env
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    profiles: ["app"]
    build: ../../../avant-worker
    command: ["celery", "-A", "avant_worker.app", "beat", "-l", "info"]
    env_file: ../../.env
    depends_on:
      rabbitmq: { condition: service_healthy }

  web:
    profiles: ["app"]
    build: ../../../avant-web
    depends_on: [api]

  nginx:
    profiles: ["app"]
    image: nginx:1.27-alpine
    volumes:
      - ../../nginx/avant.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, web]
    ports:
      - "8080:80"

volumes:
  postgres-data:
