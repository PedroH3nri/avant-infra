# Proxy do Avant no ambiente local, em HTTPS como nas VMs: / vai para o Vue, /api para o FastAPI.
# É um template do nginx: AVANT_API_UPSTREAM e AVANT_WEB_UPSTREAM vêm do compose (por padrão, o
# uvicorn e o Vite rodando na máquina; no perfil app, os containers api:8000 e web:8080).
# O certificado é do mkcert (docs/desenvolvimento.md), fora do repositório.

# Os tokens de convite e de nova senha vão na URL (/convite/<token>, /redefinir-senha/<token> e
# /api/v1/auth/invitations/<token>) e no Referer das chamadas seguintes: o access_log de cada
# server usa este formato, que grava *** no lugar deles.
map $request $avant_log_request {
    "~^(?<token_prefix>.*?/(?:api/v1/auth/invitations|convite|redefinir-senha)/)[^/?#\s]+(?<token_suffix>.*)$" "${token_prefix}***${token_suffix}";
    default $request;
}
map $http_referer $avant_log_referer {
    "~^(?<token_prefix>.*?/(?:api/v1/auth/invitations|convite|redefinir-senha)/)[^/?#\s]+(?<token_suffix>.*)$" "${token_prefix}***${token_suffix}";
    default $http_referer;
}
log_format avant_redacted '$remote_addr - $remote_user [$time_local] "$avant_log_request" '
                          '$status $body_bytes_sent "$avant_log_referer" "$http_user_agent"';

upstream avant_api {
    server ${AVANT_API_UPSTREAM};
}

upstream avant_web {
    server ${AVANT_WEB_UPSTREAM};
}

# O Vite de desenvolvimento recarrega a tela por WebSocket, pelo mesmo endereço.
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
}

# Limites por IP na borda (o IP real vem do proxy do host): rotas de login, convite e nova senha,
# e as conexões de 1 hora dos avisos em tempo real. A API tem os próprios limites por e-mail.
limit_req_zone $binary_remote_addr zone=avant_auth:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=avant_sse:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name avant.localhost;
    access_log /var/log/nginx/access.log avant_redacted;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name avant.localhost;
    access_log /var/log/nginx/access.log avant_redacted;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/avant.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/avant.localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    # Avisos em tempo real (SSE): sem buffer e com conexão longa.
    location = /api/v1/events {
        # Por IP, alto: um escritório atrás de NAT tem várias abas; por pessoa, quem limita é a API.
        limit_conn avant_sse 100;
        error_page 429 = @too_many;
        proxy_pass http://avant_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Login, 2FA, esqueci a senha, nova senha e aceite de convite: rajada curta permitida,
    # depois 30 por minuto por IP. O /auth/me e o resto da conta ficam fora.
    location ~ ^/api/v1/auth/(login|mfa/verify|password/(forgot|reset)|invitations/[^/]+/accept)$ {
        limit_req zone=avant_auth burst=20 nodelay;
        error_page 429 = @too_many;
        proxy_pass http://avant_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @too_many {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":{"code":"too_many_attempts","message":"muitas tentativas","details":{}}}';
    }

    # Documentos da Empresa: o core aceita até 5 MB; o resto do painel fica em 2 MB.
    location ~ ^/api/v1/company/documents/[a-z_]+$ {
        client_max_body_size 6m;
        proxy_pass http://avant_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://avant_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # O tag.js e o reward.js rodam no site do cliente: qualquer origem carrega, com cache de 10
    # minutos (o nome não tem hash). Os arquivos vêm da imagem do avant-web (pacote avant-tag).
    location ~ ^/(tag|reward)\.js$ {
        proxy_pass http://avant_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "public, max-age=600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Rotas públicas do reward (configuração, ícone, eventos e contato), chamadas do site do
    # cliente: corpos pequenos. A API cuida do CORS e dos limites por IP.
    location /api/reward/ {
        client_max_body_size 16k;
        proxy_pass http://avant_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Rotas públicas da ad tag (configuração e página vista), chamadas do site do cliente: corpos
    # pequenos. A API cuida do CORS e dos limites por IP.
    location /api/tag/ {
        client_max_body_size 16k;
        proxy_pass http://avant_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # /metrics só pela rede interna, nunca pela internet.
    location = /api/v1/metrics {
        return 404;
    }

    location / {
        proxy_pass http://avant_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
