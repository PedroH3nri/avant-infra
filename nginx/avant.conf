# Proxy do Avant: / vai para o Vue, /api para o FastAPI.
# Em staging e produção o upstream aponta para a cor ativa (blue ou green).

upstream avant_api {
    server api:8000;
}

upstream avant_web {
    server web:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    # Avisos em tempo real (SSE): sem buffer e com conexão longa.
    location = /api/v1/events {
        proxy_pass http://avant_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://avant_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /metrics só pela rede interna, nunca pela internet.
    location = /api/v1/metrics {
        return 404;
    }

    location / {
        proxy_pass http://avant_web;
        proxy_set_header Host $host;
    }
}
