# Proxy do Avant nas VMs. Os upstreams vêm de /etc/nginx/avant/*.conf, escritos pelo
# scripts/deploy.sh com a cor ativa de cada serviço (api-blue ou api-green etc.).
# TLS fica no proxy do host (ver nginx/host/avant.conf.example).

# DNS do Docker: com "resolve" nos upstreams, réplica que reinicia (IP novo) volta sozinha.
resolver 127.0.0.11 valid=10s ipv6=off;

include /etc/nginx/avant/api.conf;
include /etc/nginx/avant/web.conf;

# O proxy do host troca o X-Forwarded-For pelo IP real (sem aceitar o do cliente) e é o
# único que fala com este nginx. Daqui para a API vai só esse IP.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;
    server_tokens off;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Avisos em tempo real (SSE): sem buffer e com conexão longa.
    location = /api/v1/events {
        proxy_pass http://avant_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # /metrics só pela rede interna (o Prometheus fala direto com as instâncias).
    location = /api/v1/metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://avant_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location / {
        proxy_pass http://avant_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
